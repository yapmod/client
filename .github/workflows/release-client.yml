name: Release Client

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (v1.2.0); also used to retry publishing'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-client
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.finalize.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag format
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify approved source and version
        run: node .github/scripts/release.mjs verify client
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - name: Attach client bundle
        run: node .github/scripts/release.mjs upload client
      - name: Publish GitHub release
        id: finalize
        run: node .github/scripts/release.mjs finalize client

  # GITHUB_TOKEN publication does not emit a workflow-triggering release event.
  announce:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/announce-release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets:
      YAPIN_RELEASE_WEBHOOK_URL: ${{ secrets.YAPIN_RELEASE_WEBHOOK_URL }}

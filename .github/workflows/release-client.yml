name: Release Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (major/minor/patch) or exact version (e.g., 1.3.0)'
        required: true
        default: 'patch'
      prerelease:
        description: 'Create a prerelease?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git user config
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm build

      - name: Generate changelog & bump version
        run: |
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            pnpm changelogen --release --no-github --prerelease ${{ github.event.inputs.version }}
          else
            pnpm changelogen --release --no-github ${{ github.event.inputs.version }}
          fi
        working-directory: apps/client
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read new version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/client/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Push commit & tag
        run: |
          git push origin HEAD:main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: apps/client/CHANGELOG.md
          files: apps/client/dist/yapmod-client.js
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

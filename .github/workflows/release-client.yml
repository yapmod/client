name: Release Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (major/minor/patch) or exact version (e.g., 1.0.0)'
        required: true
        default: 'patch'
      prerelease:
        description: 'Create a prerelease?'
        required: false
        type: boolean
        default: false
      prerelease_type:
        description: 'Prerelease identifier (e.g., nightly, alpha, beta)'
        required: false
        default: 'nightly'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git user config
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm build

      - name: Set exact version if provided
        if: ${{ github.event.inputs.version != 'major' && github.event.inputs.version != 'minor' && github.event.inputs.version != 'patch' }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            VERSION="$VERSION-${{ github.event.inputs.prerelease_type }}"
          fi
          node -e "const pkg = require('./apps/client/package.json'); pkg.version = '$VERSION'; require('fs').writeFileSync('./apps/client/package.json', JSON.stringify(pkg, null, 2) + '\n')"

      - name: Generate changelog & bump version
        run: |
          VERSION_TYPE="${{ github.event.inputs.version }}"
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            if [ "$VERSION_TYPE" = "major" ] || [ "$VERSION_TYPE" = "minor" ] || [ "$VERSION_TYPE" = "patch" ]; then
              case "$VERSION_TYPE" in
                major) FLAG="--premajor ${{ github.event.inputs.prerelease_type }}" ;;
                minor) FLAG="--preminor ${{ github.event.inputs.prerelease_type }}" ;;
                patch) FLAG="--prepatch ${{ github.event.inputs.prerelease_type }}" ;;
              esac
              pnpm changelogen --release --no-github $FLAG
            else
              # Exact version already set, just generate changelog
              pnpm changelogen --no-github || true
            fi
          else
            if [ "$VERSION_TYPE" = "major" ] || [ "$VERSION_TYPE" = "minor" ] || [ "$VERSION_TYPE" = "patch" ]; then
              pnpm changelogen --release --no-github $VERSION_TYPE
            else
              # Exact version already set, just generate changelog
              pnpm changelogen --no-github || true
            fi
          fi
        working-directory: apps/client
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create changelog if empty
        if: ${{ !hashFiles('apps/client/CHANGELOG.md') }}
        run: |
          cat > apps/client/CHANGELOG.md << 'CHANGELOG'
          # Changelog

          All notable changes to this project will be documented in this file.
          CHANGELOG

      - name: Commit changelog and tag
        run: |
          VERSION=$(node -p "require('./apps/client/package.json').version")
          git add apps/client/package.json apps/client/CHANGELOG.md
          git commit -m "release: v$VERSION" || true
          git tag -f v$VERSION
        working-directory: .
        env:
          HUSKY: 0

      - name: Read new version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/client/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Push commit & tag
        run: |
          git push origin HEAD:main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: apps/client/CHANGELOG.md
          files: apps/client/dist/yapmod-client.js
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

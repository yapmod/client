name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: node --test .github/scripts/release.test.mjs
      - run: node --test apps/client/test/collections.test.mjs
      - run: pnpm build
      - run: pnpm --filter @yapmod/builder build
      - run: pnpm --filter @yapmod/types build
      - run: pnpm --filter @yapmod/types test:contracts

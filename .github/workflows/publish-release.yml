name: Publish release batch

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client tag (leave empty if unchanged)'
        type: string
      builder:
        description: 'Builder tag (leave empty if unchanged)'
        type: string
      types:
        description: 'Types tag (leave empty if unchanged)'
        type: string

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: publish-release-batch
  cancel-in-progress: false

jobs:
  client:
    if: github.ref == 'refs/heads/main' && inputs.client != ''
    uses: ./.github/workflows/release-client.yml
    with:
      tag: ${{ inputs.client }}
  # npm trusted publishing validates the workflow that runs `npm publish`, so the batch
  # dispatches the npm publishers as top-level runs instead of calling them.
  builder:
    if: github.ref == 'refs/heads/main' && inputs.builder != ''
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.dispatch.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.builder }}
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch builder publish
        id: dispatch
        run: node .github/scripts/release.mjs dispatch builder
  types:
    if: github.ref == 'refs/heads/main' && inputs.types != ''
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.dispatch.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.types }}
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch types publish
        id: dispatch
        run: node .github/scripts/release.mjs dispatch types
  announce:
    needs: [client, builder, types]
    if: >-
      always() && !cancelled() &&
      (needs.client.result == 'success' || needs.client.result == 'skipped') &&
      (needs.builder.result == 'success' || needs.builder.result == 'skipped') &&
      (needs.types.result == 'success' || needs.types.result == 'skipped') &&
      (needs.client.outputs.published == 'true' || needs.builder.outputs.published == 'true' || needs.types.outputs.published == 'true')
    uses: ./.github/workflows/announce-release.yml
    with:
      tags: ${{ format('{0} {1} {2}', inputs.client, inputs.builder, inputs.types) }}
    secrets:
      YAPIN_RELEASE_WEBHOOK_URL: ${{ secrets.YAPIN_RELEASE_WEBHOOK_URL }}

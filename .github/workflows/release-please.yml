name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Use Release Please's Node strategy with hand-written changelog notes.
      # Explicit dispatches keep checks and npm OIDC working with GITHUB_TOKEN.
      - run: node .github/scripts/release-please.mjs
        env:
          GH_TOKEN: ${{ github.token }}

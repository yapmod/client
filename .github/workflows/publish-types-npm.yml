name: Publish @yapmod/types to npm

# Preserve this filename: npm trusted publishing is bound to the workflow name.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (types-v1.4.0); also used to retry publishing'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-types
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.finalize.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag format
        run: '[[ "$RELEASE_TAG" =~ ^types-v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify approved source and version
        run: node .github/scripts/release.mjs verify types
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @yapmod/types build
      - name: Check npm for this version
        id: registry
        run: node .github/scripts/release.mjs npm-status types
      - name: Publish to npm
        if: steps.registry.outputs.publish == 'true'
        working-directory: packages/types
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
      - name: Publish GitHub release
        id: finalize
        run: node .github/scripts/release.mjs finalize types

  # GITHUB_TOKEN publication does not emit a workflow-triggering release event.
  announce:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/announce-release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets:
      YAPIN_RELEASE_WEBHOOK_URL: ${{ secrets.YAPIN_RELEASE_WEBHOOK_URL }}

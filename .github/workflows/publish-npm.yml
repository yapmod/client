name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (major, minor, patch, or exact version)'
        required: true
        default: 'patch'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build @yapmod/builder
        run: pnpm --filter @yapmod/builder build

      - name: Typecheck
        run: pnpm --filter @yapmod/builder typecheck

      - name: Version and publish
        working-directory: packages/builder
        run: |
          # Remove auto-generated .npmrc from setup-node that interferes with OIDC
          rm -f /home/runner/work/_temp/.npmrc ~/.npmrc
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ''

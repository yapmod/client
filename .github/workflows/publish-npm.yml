name: Publish @yapmod/builder to npm

# Preserve this filename: npm trusted publishing is bound to the workflow name.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (builder-v1.4.0); also used to retry publishing'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-builder
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag format
        run: '[[ "$RELEASE_TAG" =~ ^builder-v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify approved source and version
        run: node .github/scripts/release.mjs verify builder
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @yapmod/builder build
      - name: Check npm for this version
        id: registry
        run: node .github/scripts/release.mjs npm-status builder
      - name: Publish to npm
        if: steps.registry.outputs.publish == 'true'
        working-directory: packages/builder
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
      - name: Publish GitHub release
        run: node .github/scripts/release.mjs finalize builder

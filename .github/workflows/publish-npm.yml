name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'builder'
        type: choice
        options:
          - builder
          - types
          - all
      version:
        description: 'Version bump type (major/minor/patch) or exact version (e.g., 1.3.0)'
        required: true
        default: 'patch'

jobs:
  publish-builder:
    if: ${{ github.event.inputs.package == 'builder' || github.event.inputs.package == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for npm Trusted Publisher (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git user config
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Build @yapmod/builder
        run: pnpm --filter @yapmod/builder build

      - name: Typecheck
        run: pnpm --filter @yapmod/builder typecheck

      - name: Generate changelog & bump version
        run: pnpm changelogen --bump ${{ github.event.inputs.version }}
        working-directory: packages/builder
        env:
          HUSKY: 0

      - name: Commit & push changes
        run: |
          git add .
          git commit -m "chore(builder): bump version for npm publish [skip ci]"
          git push origin HEAD:main
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        working-directory: packages/builder
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public

  publish-types:
    if: ${{ github.event.inputs.package == 'types' || github.event.inputs.package == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for npm Trusted Publisher (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git user config
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Build @yapmod/types
        run: pnpm --filter @yapmod/types build

      - name: Typecheck
        run: pnpm --filter @yapmod/types typecheck

      - name: Generate changelog & bump version
        run: pnpm changelogen --bump ${{ github.event.inputs.version }}
        working-directory: packages/types
        env:
          HUSKY: 0

      - name: Commit & push changes
        run: |
          git add .
          git commit -m "chore(types): bump version for npm publish [skip ci]"
          git push origin HEAD:main
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        working-directory: packages/types
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public

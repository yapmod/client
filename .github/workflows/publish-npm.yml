name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (major, minor, patch, or exact version)'
        required: true
        default: 'patch'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publisher (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: npm install -g npm@latest

      - name: Configure npm registry for OIDC
        run: npm config set registry https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build @yapmod/builder
        run: pnpm --filter @yapmod/builder build

      - name: Typecheck
        run: pnpm --filter @yapmod/builder typecheck

      - name: Version and publish
        working-directory: packages/builder
        run: |
          # Unset NODE_AUTH_TOKEN so npm uses OIDC Trusted Publisher instead of token auth
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "${{ github.event.inputs.version }}" ]; then
            npm version ${{ github.event.inputs.version }} --no-git-tag-version
          else
            echo "Version is already $CURRENT_VERSION, skipping bump."
          fi
          npm publish --provenance --access public
